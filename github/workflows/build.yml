
name: Build Marzz Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source ZIP
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -iname '*Full*Storage*ESP*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP source tidak ditemukan"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d project

      - name: Build project
        run: |
          BUILD_FILE=$(find project -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle tidak ditemukan"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Building: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Marzz-Client-JAR
          path: project/**/build/libs/*.jar
          if-no-files-found: error
