
name: Build Marzz Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 
      - name: Extract Source ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP not found!"
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Found source: $ZIP_FILE"
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project


      - name: Build JAR
        run: gradle -p project/marzz-client build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Marzz-Client-Full-Storage-ESP
          path: project/marzz-client/build/libs/*.jar
          if-no-files-found: error
