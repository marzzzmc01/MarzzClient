name: Build Marzz Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Find and Extract Source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found"
            find . -maxdepth 4 -type f -print
            exit 1
          fi
          echo "Using source archive: $ZIP_FILE"
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          BUILD_FILE="$(find project -type f -name 'build.gradle' -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE="$(find project -type f -name 'build.gradle.kts' -print -quit)"
          fi
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::Gradle build file was not found in extracted source."
            find project -maxdepth 5 -type f -print
            exit 1
          fi
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build JAR
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Marzz-Client-Full-Storage-ESP
          path: project/**/build/libs/*.jar
          if-no-files-found: error
